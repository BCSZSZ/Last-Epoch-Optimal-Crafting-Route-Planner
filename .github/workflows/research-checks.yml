name: Verify research snapshot and mathematical examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -X utf8 scripts/validate_research.py
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 scripts/check_browser_memory.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run model
      - run: npm run check
      - run: npm test
