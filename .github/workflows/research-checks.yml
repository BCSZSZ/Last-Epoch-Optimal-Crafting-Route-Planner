name: Verify research snapshot and mathematical examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 38399c2bd4d39051d74c6eac3351380231fd57e0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -X utf8 scripts/validate_research.py
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 scripts/check_browser_memory.py --allow-historical
      - run: python -X utf8 scripts/research_redemption_intrinsic.py --verify-only
      - run: python -X utf8 scripts/check_strategy_classification.py --verify-only
      - run: python -X utf8 scripts/analyze_upper_state_projection.py --verify-only
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run model
      - run: python -X utf8 scripts/build_affix_localization.py --verify-only
      - run: npm run check
      - run: npx tsx scripts/research_intrinsic_routes.ts --verify-only
      - run: npx tsx scripts/research_acquisition_order.ts --verify-only
      - run: npx tsx scripts/check_upper_state_havoc.ts --verify-only
      - run: npx tsx scripts/validate_hierarchy.ts --verify-only
      - run: npx tsx scripts/check_hierarchy_browser.ts --historical --verify-only
      - run: npx tsx scripts/check_ui_reports.ts --historical --verify-only
      - run: npm test
      - run: npm run learn:routes -- --quiet --verify-only
      - run: npx tsx scripts/research_fp65_budget48.ts --verify-only
      - run: npx tsx scripts/check_completion_patterns.ts --historical
      - run: npx tsx scripts/check_completion_ui.ts --historical --verify-only
      - run: npx tsx scripts/check_public_completion_ui.ts --historical --verify-only
      - run: npx tsx scripts/check_slot_target_ui.ts --historical --verify-only
      - run: npx tsx scripts/check_slot_target_ui.ts --public --historical --verify-only
      - run: npx tsx scripts/research_7271_routes.ts --verify-only
      - run: npx tsx scripts/check_capacity_ui.ts --historical --verify-only
      - run: npx tsx scripts/check_detailed_ui.ts --historical --verify-only
      - run: npx tsx scripts/check_detailed_ui.ts --public --historical --verify-only
      - run: npx tsx scripts/check_capacity_ui.ts --public --historical --verify-only
      - run: npx tsx scripts/verify_program_release.ts --verify-only
      - run: npx tsx scripts/crosscheck_program_sampling.ts --verify-only
      - run: npx tsx scripts/check_program_ui.ts --historical --verify-only
      - run: npx tsx scripts/check_program_ui.ts --public --verify-only
      - run: npx tsx scripts/check_device_benchmark.ts research/device-validation/desktop-baseline.json --historical
      - run: npx tsx scripts/check_device_benchmark.ts research/device-validation/public-normal.json --historical

  current-finite48:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -X utf8 scripts/validate_research.py
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: npm run model
      - run: python -X utf8 scripts/research_natural_fp_percentile_20261108.py --verify-only
      - run: npm run check
      - run: npm test
      - run: npx tsx scripts/check_program_ui.ts --historical --verify-only
      - run: npx tsx scripts/check_program_ui.ts --public --historical --verify-only
